[project]
name = "edmonton-transit-access"
version = "0.1.0"
description = "Visualizing the accessibility of Edmonton's Transit Service to people and places."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb",
    "geopandas",
    "pandas",
    "pyarrow",
    "pyproj",
    "requests",
    "shapely",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
